# UniTn RAG - configuration
# Everything environment-specific lives here. No paths or model names in code.
# Override any field with a second file:  python scripts/build_index.py --config config.uni.yaml

paths:
  # JSONL, one document per line, keys: url, title, text (plus optional lang, hreflang, last_modified)
  corpus: dataset.v2.jsonl
  index_dir: storage/index
  eval_set: data/evaluation_set.json
  eval_results: results/eval_results.json

data:
  min_chars: 150          # drop near-empty / boilerplate pages
  max_docs: null          # set to e.g. 2000 for a fast local smoke test
  # Languages in scope. The crawler's `lang` decides; detect_language() only
  # knows it/en, so a zh page would silently resolve to 'en' and compete for
  # English queries. Set to null to keep every language.
  keep_languages: [it, en]

chunking:
  chunk_size: 512         # was 256 - larger keeps facts attached to their headers
  chunk_overlap: 100      # ~20% overlap, per your notes
  inject_header: true     # prepend TITLE/SOURCE/LANGUAGE/YEAR into the chunk text itself

  # Hybrid chunking. Documents >= semantic_min_chars are split semantically;
  # shorter ones keep fixed-size splitting.
  #   0     fixed-size everywhere (baseline for the ablation)
  #   8000  10,065 docs / 81% of corpus text - 96% of them PDFs with no headings
  #   2000  more aggressive; risks fragmenting single-topic pages
  # The median document is ~1,540 chars, so a corpus-wide setting would cut up
  # pages that should stay whole.
  semantic_min_chars: 8000
  semantic_buffer_size: 1     # sentences grouped before comparing
  semantic_percentile: 95     # split where distance exceeds this percentile

embedding:
  # bge-base-en-v1.5 is English-only; bge-m3 is multilingual and handles the IT corpus.
  model_name: BAAI/bge-m3
  device: auto            # auto | cpu | cuda | mps
  batch_size: 64          # 64 and 128 measured the same on GB10; 64 is safer
  # auto | float16 | bfloat16 | float32
  # Measured on GB10: fp32 50 chunks/sec (128 min), fp16 231 (28 min).
  # 'auto' selects fp16 on CUDA and full precision elsewhere.
  dtype: auto
  # dimension is auto-detected from the model - never hardcode it again

retrieval:
  similarity_top_k: 20    # chunks pulled from FAISS before dedup
  max_pages: 5            # distinct documents passed to the LLM
  dedup_by: doc_group     # doc_group | url  (doc_group collapses IT/EN translations)
  prefer_query_language: true
  chunk_char_limit: 2500  # was 1200. Chunks are 512 *tokens* (~1500-2500 chars
                          # of Italian) plus the injected header, so 1200 cut the
                          # tail off every chunk the LLM was shown.
  resolve_year_from_title: true  # trust the filename's edition year over the
                                 # crawl's effective_year, which falls back to
                                 # the upload date for Alfresco PDFs
  url_affinity_weight: 0.25      # boost documents whose URL host/slug matches
                                 # words in the question (0.0 disables)

llm:
  # Base URL and API key come from .env - never commit them
  # /v1/models lists the platform catalogue, not what is resident on this machine.
  # ollama-mac1 currently serves only llama3.2:latest; everything else 401s with
  # "not loaded on machine". Ask the platform admins which host has gpt-oss:20b -
  # that is the model the Colab notebook used, so eval numbers are only comparable
  # to the notebook baseline once we are pointed at it.
  # llama3.2 is 3B: fine for wiring up the pipeline, too weak to trust for scores.
  model: gemma3:27b
  temperature: 0.0
  max_tokens: 700         # was 256, which truncated longer procedural answers
  # 180, not 60: chunk_char_limit went 1200 -> 2500, so a 10-page eval prompt
  # is ~25k characters instead of ~12k. gemma3:27b exceeded the old ceiling on
  # the sem8k arm and one timeout aborted the whole 25-minute run.
  timeout: 180
